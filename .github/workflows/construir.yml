name: Construir imagen be levels

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: construir
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Chatwoot y nombre de la imagen
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < CHATWOOT_VERSION)"
          EDICION="$(tr -d '[:space:]' < CHATWOOT_EDITION 2>/dev/null || echo community)"
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY,,}"
          SUFIJO=""; [[ "$EDICION" == "enterprise" ]] && SUFIJO="-ee"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "edicion=$EDICION" >> "$GITHUB_OUTPUT"
          echo "imagen=$IMAGEN" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION$SUFIJO-bl.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Descargar Chatwoot ${{ steps.v.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: chatwoot/chatwoot
          ref: ${{ steps.v.outputs.version }}
          path: upstream

      - name: Aplicar cambios be levels
        run: bash scripts/preparar.sh upstream

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.tag }}
            ${{ steps.v.outputs.imagen }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Chatwoot ${{ steps.v.outputs.version }} (${{ steps.v.outputs.edicion }}) con marca be levels
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "## Imagen lista"
            echo
            echo "En Dokploy, en el compose de Chatwoot, usa:"
            echo
            echo '```'
            echo "image: ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
